# Builds the Windows installer (3D-Cards-Setup.exe), the Mac app (3D-Cards.dmg) and the
# Android app (3D-Cards.apk), all with the same version, and publishes them on the Releases page.
#
# How to use (no command line needed):
#   GitHub → Actions → 「建置 App（Windows + Mac + Android）」 → Run workflow → enter a version → Run workflow.
# The version must be higher than the previous one (1.0.1 → 1.0.2 → 1.1.0 …).
# Installed apps compare their version with the newest release on start-up and offer the update.

name: 建置 App（Windows + Mac + Android）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.0.1，要比上一版大）"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check version format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本號要寫成三段數字，例如 1.0.1"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node copy-web.js
          set +e
          npx tauri build --bundles nsis --config "{\"version\":\"$VERSION\"}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -nE "error|Error|failed|warning: unused" build.log | tail -n 30; } | sed -e 's/%/%25/g' -e 's/^/::error::/'
            exit "$status"
          fi
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$exe" ../3D-Cards-Setup.exe
          ls -la ../3D-Cards-Setup.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" 3D-Cards-Setup.exe --clobber
          else
            # Tag the commit that was built, so 「建置 Microsoft Store 版」 can build the same code.
            gh release create "$tag" 3D-Cards-Setup.exe --target "$GITHUB_SHA" \
              --title "3D Cards $VERSION" \
              --notes "Windows：下載 **3D-Cards-Setup.exe** 並執行即可安裝或更新。Mac：下載 **3D-Cards.dmg**，打開後把 3D Cards 拖到「應用程式」資料夾。Android：下載 **3D-Cards.apk** 安裝（要允許安裝不明來源的應用程式）。已安裝的 App 打開時會提示更新。" \
              --latest
          fi

  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # One .dmg for every Mac: Apple silicon (M1 and later) and Intel.
      - name: Build DMG
        working-directory: desktop
        env:
          VERSION: ${{ inputs.version }}
          # Optional: an Apple Developer ID removes the "unidentified developer" warning. See docs/維護說明.md.
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            s="SECRET_$v"
            if [ -n "${!s}" ]; then export "$v=${!s}"; fi
          done
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            config="{\"version\":\"$VERSION\"}"
          else
            # No Apple Developer ID: sign ad hoc, which Apple silicon Macs need to run the app at all.
            echo "::notice::沒有設定 Apple 開發者憑證，Mac 版用免費的臨時簽名。第一次打開時使用者要在「隱私權與安全性」按「仍要打開」。"
            config="{\"version\":\"$VERSION\",\"bundle\":{\"macOS\":{\"signingIdentity\":\"-\"}}}"
          fi
          node copy-web.js
          set +e
          npx tauri build --bundles dmg --target universal-apple-darwin --config "$config" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 60 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Mac build::$msg"
            exit "$status"
          fi
          set -e
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n 1)
          cp "$dmg" ../3D-Cards.dmg
          ls -la ../3D-Cards.dmg
          # Check the app people get: inside the .dmg (the build removes its own copy of the .app).
          mnt=$(mktemp -d)
          hdiutil attach ../3D-Cards.dmg -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          lipo -info "$mnt/3D Cards.app/Contents/MacOS/three-d-cards"
          codesign --verify --deep --strict "$mnt/3D Cards.app"
          codesign -dv "$mnt/3D Cards.app" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier"
          hdiutil detach "$mnt" >/dev/null

      - name: Publish DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" 3D-Cards.dmg --clobber

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check the signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::還沒有設定 Android 簽名金鑰（ANDROID_KEYSTORE_B64、ANDROID_KEYSTORE_PASSWORD）。這次的 APK 只用臨時金鑰簽名、不會發布，請看 docs/維護說明.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build APK
        working-directory: desktop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          node copy-web.js
          npx tauri android init --ci
          node android-patch.js
          npx tauri icon src-tauri/icons/icon.png
          set +e
          npx tauri android build --apk --aab --ci --target aarch64 armv7 --config "{\"version\":\"$VERSION\"}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # One annotation with the end of the log (GitHub shows at most 10 annotations per step).
            msg=$(tail -n 60 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build::$msg"
            exit "$status"
          fi
          find src-tauri/gen/android/app/build/outputs \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Sign APK and AAB
        working-directory: desktop
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then
            echo "$KS" | base64 -d > release.jks
          else
            export KS_PASS=temporary-test-key
            keytool -genkeypair -keystore release.jks -alias 3dcards -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=3D Cards test build"
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$bt/zipalign" -p -f 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks release.jks --ks-key-alias 3dcards --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../3D-Cards.apk aligned.apk
          "$bt/apksigner" verify --print-certs ../3D-Cards.apk
          # The Play Store takes an app bundle (.aab), signed with the same key as the upload key.
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*release*.aab" | head -n 1)
          cp "$aab" ../3D-Cards-PlayStore.aab
          jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 ../3D-Cards-PlayStore.aab 3dcards
          jarsigner -verify ../3D-Cards-PlayStore.aab | tail -n 1
          rm -f release.jks
          ls -la ../3D-Cards.apk ../3D-Cards-PlayStore.aab

      - name: Keep the test APK (no signing key yet)
        if: steps.key.outputs.ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Cards-test-apk
          path: |
            3D-Cards.apk
            3D-Cards-PlayStore.aab
          retention-days: 7

      - name: Publish APK
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" 3D-Cards.apk 3D-Cards-PlayStore.aab --clobber
