# Builds the Windows installer (3D-Cards-Setup.exe, a few MB) and publishes it on the Releases page.
#
# How to use (no command line needed):
#   GitHub → Actions → 「建置 Windows 電腦版」 → Run workflow → enter a version → Run workflow.
# The version must be higher than the previous one (1.0.1 → 1.0.2 → 1.1.0 …).
# Installed apps compare their version with the newest release on start-up and offer the update.

name: 建置 Windows 電腦版

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.0.1，要比上一版大）"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check version format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本號要寫成三段數字，例如 1.0.1"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node copy-web.js
          set +e
          npx tauri build --bundles nsis --config "{\"version\":\"$VERSION\"}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -nE "error|Error|failed|warning: unused" build.log | tail -n 30; } | sed -e 's/%/%25/g' -e 's/^/::error::/'
            exit "$status"
          fi
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$exe" ../3D-Cards-Setup.exe
          ls -la ../3D-Cards-Setup.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" 3D-Cards-Setup.exe --clobber
          else
            gh release create "$tag" 3D-Cards-Setup.exe \
              --title "3D Cards $VERSION" \
              --notes "下載 **3D-Cards-Setup.exe** 並執行即可安裝或更新。已安裝的電腦版打開時會提示更新。" \
              --latest
          fi
